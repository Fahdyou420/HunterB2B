<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hunter Auto 1.0 - Agent Control</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://unpkg.com/htmx.org@1.9.11"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <nav class="sidebar">
        <div class="logo">
            <i data-lucide="radar"></i>
            Hunter Auto
        </div>
        <ul class="nav-links">
            <li><a href="/"><i data-lucide="layout-dashboard"></i> Dashboard</a></li>
            <li><a href="/leads"><i data-lucide="users"></i> Leads</a></li>
            <li><a href="/settings"><i data-lucide="settings"></i> Settings</a></li>
        </ul>
    </nav>
    <main class="content">
        {% block content %}{% endblock %}
    </main>

    <script>
        // Initialize lucide icons
        lucide.createIcons();
        
        // Re-initialize icons after htmx swap
        document.body.addEventListener('htmx:afterSwap', function(evt) {
            lucide.createIcons();
        });
    </script>
</body>
</html>
