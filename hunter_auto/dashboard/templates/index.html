{% extends 'base.html' %}
{% block content %}
<div class="header">
    <h1>Dashboard</h1>
    <p>System overview and automated agent metrics.</p>
</div>

{% include 'partials/controls.html' %}

<div style="margin-top: 32px;">
    {% include 'partials/stats.html' %}
</div>

<div style="margin-top: 32px; background: white; border: 1px solid #E2E8F0; border-radius: 12px; padding: 24px;">
    <h3 style="margin: 0 0 16px 0; font-size: 16px; display: flex; align-items: center; gap: 8px;">
        <i data-lucide="activity" style="color: #10B981" size="18"></i> Live Workflow Activity
    </h3>
    <div style="background: #F8FAFC; border: 1px solid #CBD5E1; border-radius: 8px; padding: 16px; max-height: 300px; overflow-y: auto;" hx-get="/api/live_feed" hx-trigger="every 2s">
        <div style="color: #64748B; font-size: 13px; font-family: monospace;">Fetching live feed...</div>
    </div>
</div>
{% endblock %}
