<div id="scheduler-controls" class="controls-card" style="background: white; padding: 24px; border-radius: 12px; border: 1px solid #E2E8F0; margin-bottom: 24px;">
    <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 20px;">
        <div>
            <h3 style="margin: 0 0 4px 0; font-size: 18px;">Automated Engine Agent</h3>
            <div style="font-size: 14px; color: #64748B;">
                System Status: <strong style="color: {{ '#10B981' if scheduler_status.is_running else '#EF4444' }}">{{ "Active (Running)" if scheduler_status.is_running else "Paused" }}</strong>
            </div>
        </div>
        <div class="actions">
            {% if scheduler_status.is_running %}
                <button class="btn" style="background:#FEF2F2; color:#EF4444; border: 1px solid #FCA5A5;" hx-post="/api/action/pause" hx-target="#scheduler-controls" hx-swap="outerHTML">
                    <i data-lucide="pause-circle" size="18"></i> Pause AI Mode
                </button>
            {% else %}
                <button class="btn" style="background:#ECFDF5; color:#10B981; border: 1px solid #6EE7B7;" hx-post="/api/action/resume" hx-target="#scheduler-controls" hx-swap="outerHTML">
                    <i data-lucide="play-circle" size="18"></i> Resume AI Mode
                </button>
            {% endif %}
        </div>
    </div>

    <div style="border-top: 1px solid #E2E8F0; margin: 20px 0;"></div>

    <h3 style="margin: 0 0 16px 0; font-size: 16px;">Manual Controls</h3>
    <div style="display: flex; gap: 12px; flex-wrap: wrap;">
        <button class="btn" style="background: white; border: 1px solid #E2E8F0; color: #0F172A;" hx-post="/api/action/trigger_scrape" hx-swap="none" onclick="alert('Google Maps scraping started in background. Check logs.')">
            <i data-lucide="map-pin" size="16"></i> Maps Scrape
        </button>
        
        <button class="btn" style="background: #E0E7FF; border: 1px solid #A5B4FC; color: #3730A3;" hx-post="/api/action/trigger_linkedin" hx-swap="none" onclick="alert('LinkedIn scraping started in background. Check logs.')">
            <i data-lucide="linkedin" size="16"></i> LinkedIn Scrape
        </button>

        <button class="btn" style="background: white; border: 1px solid #E2E8F0; color: #0F172A;" hx-post="/api/action/trigger_outreach" hx-swap="none" onclick="alert('Outreach started in background. Check logs.')">
            <i data-lucide="send" size="16"></i> Start Outreach
        </button>

        <button class="btn" style="background: #FEF3C7; border: 1px solid #FCD34D; color: #B45309;" hx-post="/api/action/check_ai" hx-swap="none" onclick="
            fetch('/api/action/check_ai', {method:'POST'})
            .then(res => res.json())
            .then(data => alert(data.message))
            .catch(err => alert('Failed to connect to AI container'));
        ">
            <i data-lucide="cpu" size="16"></i> Check AI Container
        </button>
    </div>
</div>
