<div id="scheduler-controls" class="controls-card">
    <div>
        <h3>System Controls</h3>
        <div class="status">
            Agent Status: <strong style="color: {{ '#10B981' if scheduler_status.is_running else '#64748B' }}">{{ "Active (Running)" if scheduler_status.is_running else "Paused" }}</strong>
        </div>
    </div>
    <div class="actions flex-row">
        {% if scheduler_status.is_running %}
            <button class="btn btn-outline" hx-post="/api/action/pause" hx-target="#scheduler-controls" hx-swap="outerHTML">
                <i data-lucide="pause-circle"></i> Pause
            </button>
        {% else %}
            <button class="btn btn-success" hx-post="/api/action/resume" hx-target="#scheduler-controls" hx-swap="outerHTML">
                <i data-lucide="play-circle"></i> Resume
            </button>
        {% endif %}
        <button class="btn btn-blue" hx-post="/api/action/trigger_scrape" hx-swap="none" onclick="alert('Scraping job queued in background')">
            <i data-lucide="search"></i> Trigger Scrape
        </button>
        <button class="btn" hx-post="/api/action/trigger_outreach" hx-swap="none" onclick="alert('Outreach job queued in background')">
            <i data-lucide="send"></i> Trigger Outreach
        </button>
    </div>
</div>
