<div id="scheduler-controls" class="controls-card" style="background: white; padding: 24px; border-radius: 12px; border: 1px solid #E2E8F0; margin-bottom: 24px;">
    <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 20px;">
        <div>
            <h3 style="margin: 0 0 4px 0; font-size: 18px;">Automated Engine Agent</h3>
            <div style="font-size: 14px; color: #64748B;">
                System Status: <strong style="color: {{ '#10B981' if scheduler_status.is_running else '#EF4444' }}">{{ "Active (Running)" if scheduler_status.is_running else "Paused" }}</strong>
            </div>
        </div>
        <div class="actions">
            {% if scheduler_status.is_running %}
                <button class="btn" style="background:#FEF2F2; color:#EF4444; border: 1px solid #FCA5A5;" hx-post="/api/action/pause" hx-target="#scheduler-controls" hx-swap="outerHTML">
                    <i data-lucide="pause-circle" size="18"></i> Pause AI Mode
                </button>
            {% else %}
                <button class="btn" style="background:#ECFDF5; color:#10B981; border: 1px solid #6EE7B7;" hx-post="/api/action/resume" hx-target="#scheduler-controls" hx-swap="outerHTML">
                    <i data-lucide="play-circle" size="18"></i> Resume AI Mode
                </button>
            {% endif %}
        </div>
    </div>

    <div style="border-top: 1px solid #E2E8F0; margin: 20px 0;"></div>

    <h3 style="margin: 0 0 16px 0; font-size: 16px;">System Workflow (Manual Overrides)</h3>
    
    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-bottom: 20px;">
        <!-- Layer 1 -->
        <div style="background: #F8FAFC; border: 1px dashed #CBD5E1; padding: 16px; border-radius: 8px; text-align: center;">
            <div style="color: #64748B; font-size: 12px; text-transform: uppercase; font-weight: 600; margin-bottom: 8px;">1. Scraping Layer</div>
            <form hx-post="/api/action/trigger_scrape" hx-swap="none" onsubmit="alert('Scraping started. Check logs.')" style="display: flex; flex-direction: column; gap: 8px; text-align: left;">
                <label style="font-size: 12px; color: #475569;">Target Sector:</label>
                <input type="text" name="sector" value="IT" style="padding: 6px; font-size: 13px; border: 1px solid #CBD5E1; border-radius: 4px;" required>
                
                <label style="font-size: 12px; color: #475569;">Limit per source:</label>
                <input type="number" name="limit" value="10" min="1" max="50" style="padding: 6px; font-size: 13px; border: 1px solid #CBD5E1; border-radius: 4px;" required>
                
                <label style="font-size: 12px; color: #475569;">Source:</label>
                <select name="source" style="padding: 6px; font-size: 13px; border: 1px solid #CBD5E1; border-radius: 4px;">
                    <option value="both">Both (Maps + LinkedIn)</option>
                    <option value="maps">Google Maps Only</option>
                    <option value="linkedin">LinkedIn Only</option>
                </select>

                <button type="submit" class="btn" style="width: 100%; justify-content: center; background: white; border: 1px solid #E2E8F0; color: #0F172A; margin-top: 8px;">
                    <i data-lucide="search" size="16"></i> Scrape Now
                </button>
            </form>
        </div>

        <!-- Layer 2 -->
        <div style="background: #F0F9FF; border: 1px dashed #BAE6FD; padding: 16px; border-radius: 8px; text-align: center;">
            <div style="color: #0369A1; font-size: 12px; text-transform: uppercase; font-weight: 600; margin-bottom: 8px;">2. Local AI Layer</div>
            <button class="btn" style="width: 100%; justify-content: center; background: #E0F2FE; border: 1px solid #7DD3FC; color: #0369A1;" hx-post="/api/action/trigger_enrich" hx-swap="none" onclick="alert('AI Enrichment & Routing started. Check logs.')">
                <i data-lucide="brain-circuit" size="16"></i> AI Enrichment
            </button>
        </div>

        <!-- Layer 3 -->
        <div style="background: #FFF7ED; border: 1px dashed #FFEDD5; padding: 16px; border-radius: 8px; text-align: center;">
            <div style="color: #C2410C; font-size: 12px; text-transform: uppercase; font-weight: 600; margin-bottom: 8px;">3. Outreach Engine</div>
            <button class="btn" style="width: 100%; justify-content: center; background: #FFEDD5; border: 1px solid #FDBA74; color: #C2410C;" hx-post="/api/action/trigger_outreach" hx-swap="none" onclick="alert('Outreach Router started. Check logs.')">
                <i data-lucide="send" size="16"></i> Start Outreach
            </button>
        </div>
    </div>

    <div style="display: flex; gap: 12px; flex-wrap: wrap; justify-content: center;">
        <button class="btn" style="background: #FEF3C7; border: 1px solid #FCD34D; color: #B45309;" hx-post="/api/action/check_ai" hx-swap="none" onclick="
            fetch('/api/action/check_ai', {method:'POST'})
            .then(res => res.json())
            .then(data => alert(data.message))
            .catch(err => alert('Failed to connect to AI container'));
        ">
            <i data-lucide="cpu" size="16"></i> Ping Ollama AI Engine
        </button>
    </div>
</div>
