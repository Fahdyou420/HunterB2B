<div class="stats-grid" hx-get="/api/stats-html" hx-trigger="every 30s" hx-swap="outerHTML">
    <div class="stat-card">
        <div class="header-row">
            <h3>Total Leads</h3>
            <div class="icon"><i data-lucide="users" size="18"></i></div>
        </div>
        <div class="value">{{ stats.total }}</div>
    </div>
    <div class="stat-card">
        <div class="header-row">
            <h3>High Score (7+)</h3>
            <div class="icon"><i data-lucide="star" size="18"></i></div>
        </div>
        <div class="value">{{ stats.high_score }}</div>
    </div>
    <div class="stat-card">
        <div class="header-row">
            <h3>Ready to Call</h3>
            <div class="icon"><i data-lucide="phone-call" size="18"></i></div>
        </div>
        <div class="value">{{ stats.cold_call_queue }}</div>
    </div>
    <div class="stat-card">
        <div class="header-row">
            <h3>Skipped (No Phone)</h3>
            <div class="icon"><i data-lucide="x-circle" size="18"></i></div>
        </div>
        <div class="value">{{ stats.skipped }}</div>
    </div>
</div>
